name: PR Validation

on:
  pull_request:

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Prettier check
        id: prettier
        shell: bash
        run: |
          npm run format:check || {
            npm run format
            git diff --exit-code --ignore-cr-at-eol
          }
        continue-on-error: true

      - name: Run ESLint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Run typecheck
        id: typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Check release note
        id: release_note
        run: npm run release-note:check
        continue-on-error: true

      - name: Run Jest with 90% coverage threshold
        id: jest
        run: npm test
        continue-on-error: true

      - name: ReportGenerator
        id: coverage_report
        if: always()
        continue-on-error: true
        uses: im-open/code-coverage-report-generator@4
        with:
          reports: coverage/jest/cobertura-coverage.xml
          targetdir: coverage-results
          title: Manuvie Évolution code coverage
          reporttypes: MarkdownSummary;

      - name: Create a status check for code coverage results
        id: code_coverage_check
        if: always()
        continue-on-error: true
        uses: im-open/process-code-coverage-summary@v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-file: coverage-results/Summary.md
          report-name: Manuvie Évolution Code Coverage
          check-name: code coverage
          create-status-check: true
          create-pr-comment: true
          update-comment-if-one-exists: true
          update-comment-key: manuvie-evolution
          ignore-threshold-failures: false
          line-threshold: 90
          branch-threshold: 90

      - name: Generate coverage summary
        id: coverage
        if: always()
        run: npm run coverage:summary
        continue-on-error: true

      - name: Run Playwright tests
        id: playwright
        run: npm run test:visual
        continue-on-error: true

      - name: Build Chrome extension package
        id: build
        run: npm run build
        continue-on-error: true

      - name: Upload Playwright screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-validation-artifacts
          path: |
            test-results/
            coverage/jest/
            playwright-report/
          if-no-files-found: ignore

      - name: Upload Chrome extension package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manuvie-evolution-chrome-store-package
          path: dist/*-chrome-store.zip
          if-no-files-found: ignore

      - name: Collect validation status
        id: validation_status
        if: always()
        shell: bash
        run: |
          status () {
            if [ "$1" = "success" ]; then echo "pass"; else echo "fail"; fi
          }

          prettier_status=$(status "${{ steps.prettier.outcome }}")
          lint_status=$(status "${{ steps.lint.outcome }}")
          typecheck_status=$(status "${{ steps.typecheck.outcome }}")
          release_note_status=$(status "${{ steps.release_note.outcome }}")
          jest_status=$(status "${{ steps.jest.outcome }}")
          playwright_status=$(status "${{ steps.playwright.outcome }}")
          build_status=$(status "${{ steps.build.outcome }}")

          coverage_status="pass"
          if [ "${{ steps.coverage.outcome }}" != "success" ]; then
            coverage_status="fail"
          fi

          echo "prettier=$prettier_status" >> $GITHUB_OUTPUT
          echo "lint=$lint_status" >> $GITHUB_OUTPUT
          echo "typecheck=$typecheck_status" >> $GITHUB_OUTPUT
          echo "release_note=$release_note_status" >> $GITHUB_OUTPUT
          echo "jest=$jest_status" >> $GITHUB_OUTPUT
          echo "coverage=$coverage_status" >> $GITHUB_OUTPUT
          echo "playwright=$playwright_status" >> $GITHUB_OUTPUT
          echo "build=$build_status" >> $GITHUB_OUTPUT

          should_fail=false
          if [ "$prettier_status" = "fail" ] || [ "$lint_status" = "fail" ] || [ "$typecheck_status" = "fail" ] || [ "$release_note_status" = "fail" ] || [ "$jest_status" = "fail" ] || [ "$coverage_status" = "fail" ] || [ "$playwright_status" = "fail" ] || [ "$build_status" = "fail" ]; then
            should_fail=true
          fi

          echo "should_fail=$should_fail" >> $GITHUB_OUTPUT

      - name: Find existing Manuvie Évolution validation comment
        id: find_comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: manuvie-evolution-validation

      - name: Create or update Manuvie Évolution validation summary
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- manuvie-evolution-validation -->
            ## Manuvie Évolution Validation

            [![Prettier](https://img.shields.io/static/v1?label=Prettier&message=${{ steps.validation_status.outputs.prettier }}&color=${{ steps.validation_status.outputs.prettier == 'fail' && 'red' || 'brightgreen' }})](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            [![Lint](https://img.shields.io/static/v1?label=Lint&message=${{ steps.validation_status.outputs.lint }}&color=${{ steps.validation_status.outputs.lint == 'fail' && 'red' || 'brightgreen' }})](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            [![Typecheck](https://img.shields.io/static/v1?label=Typecheck&message=${{ steps.validation_status.outputs.typecheck }}&color=${{ steps.validation_status.outputs.typecheck == 'fail' && 'red' || 'brightgreen' }})](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            [![Release Note](https://img.shields.io/static/v1?label=Release%20Note&message=${{ steps.validation_status.outputs.release_note }}&color=${{ steps.validation_status.outputs.release_note == 'fail' && 'red' || 'brightgreen' }})](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            [![Jest 90%](https://img.shields.io/static/v1?label=Jest%2090%25&message=${{ steps.validation_status.outputs.jest }}&color=${{ steps.validation_status.outputs.jest == 'fail' && 'red' || 'brightgreen' }})](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            [![Coverage](https://img.shields.io/static/v1?label=Coverage&message=${{ steps.validation_status.outputs.coverage }}&color=${{ steps.validation_status.outputs.coverage == 'fail' && 'red' || 'brightgreen' }})](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            [![Playwright](https://img.shields.io/static/v1?label=Playwright&message=${{ steps.validation_status.outputs.playwright }}&color=${{ steps.validation_status.outputs.playwright == 'fail' && 'red' || 'brightgreen' }})](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            [![Build](https://img.shields.io/static/v1?label=Build&message=${{ steps.validation_status.outputs.build }}&color=${{ steps.validation_status.outputs.build == 'fail' && 'red' || 'brightgreen' }})](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ${{ steps.coverage.outputs.summary }}

            Artifacts:
            - Playwright screenshots/report: `playwright-validation-artifacts`
            - Chrome Store ZIP: `manuvie-evolution-chrome-store-package`

            ---
            [Voir le run complet](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Enforce validation gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.validation_status.outputs.should_fail }}" = "true" ]; then
            echo "Manuvie Évolution validation failed."
            exit 1
          fi
